aid: ivo
name: Ivo
description: >-
  Ivo (Ivo AI, Inc., formerly Latch) is an AI-powered contract intelligence
  platform built for in-house legal teams at enterprises. Founded in 2022 and
  headquartered in San Francisco, Ivo delivers three integrated products that
  share one AI engine: Ivo Review (a Microsoft Word add-in that applies a
  company's playbooks clause-by-clause to produce surgical redlines), Ivo
  Assistant (an agentic AI for drafting, cross-contract Q&A, and legal research)
  and Ivo Intelligence (an AI-native repository, powered by its AiRE engine,
  that turns existing contract libraries into queryable business intelligence).
  Customers include Uber, Shopify, IBM, Atlassian, Canva, Reddit and Pinterest.
  Ivo is enterprise-only with custom pricing and no public developer API; it
  publishes a canonical llms.txt, a Trust Center (SOC 2 Type II, ISO 27001:2022,
  GDPR, CCPA), and a responsible-disclosure security.txt.
